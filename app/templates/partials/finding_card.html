<div class="finding">
    <div class="finding-header">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span class="severity severity-{{ finding.severity }}">
                {{ finding.severity }}
            </span>
            <a href="#line-{{ finding.line_number }}"
               class="finding-line-link line-number"
               data-line="{{ finding.line_number }}">
                Line {{ finding.line_number }} ↗
            </a>
            <span style="font-size:0.75rem; color:var(--text-muted); font-family:monospace;">
                {{ finding.rule_id }}
            </span>
        </div>
        <span class="status-badge status-{{ finding.status }}">
            {{ finding.status }}
        </span>
    </div>

    <p style="font-size:0.85rem; margin-top:6px; color:var(--text);">
        {{ finding.message }}
    </p>

    {% if finding.explanation %}
    <div class="finding-explanation">
        💡 {{ finding.explanation }}
    </div>
    {% endif %}
</div>
