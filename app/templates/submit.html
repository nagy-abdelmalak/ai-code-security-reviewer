{% extends "base.html" %}
{% block title %}Submit Code{% endblock %}

{% block content %}
<div class="card">
    <h2>Submit Code for Analysis</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/web/submit">
        <label for="code">Paste your Python code</label>
        <textarea name="code" id="code" placeholder="# Paste your Python code here...">{{ code or '' }}</textarea>

        <div class="toggle-group">
            <input type="checkbox" name="run_llm" id="run_llm" value="true">
            <label for="run_llm" style="margin:0;">Run LLM analysis (sends code to external provider)</label>
        </div>

        <div class="toggle-group">
            <input type="checkbox" name="explanation_enabled" id="explanation_enabled" value="true">
            <label for="explanation_enabled" style="margin:0;">Include plain-language explanations</label>
        </div>

        <button type="submit" class="btn btn-primary">Analyze</button>
    </form>
</div>
{% endblock %}
