name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check app/ tests/

      - name: Run test
        env: 
          JWT_SECRET_KEY: ci-test-secret-that-is-at-least-32-bytes-long-for-hmac
          INITIAL_ADMIN_EMAIL: admin@test.local
          INITIAL_ADMIN_PASSWORD: test_password
          DATABASE_URL: sqlite:///./test.db
          ENVIRONMENT: test
          ENABLED_SAST_ANALYZERS: semgrep,bandit
        run: uv run pytest -v 